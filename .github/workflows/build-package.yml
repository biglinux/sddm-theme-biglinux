name: Build Package

# Controls when the workflow will run
on:
  workflow_dispatch:

  push:
    #branches: [ "master", "main", "*" ]
    branches: [ "*" ]
  #pull_request:
    #branches: [ "master", "main", "*" ]
    #branches: [ "*" ]

# The job only calls the build repository's API with its own token.
permissions: {}

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Send Hooks BigLinux Build Package
        shell: bash
        # Passed through the environment: a branch name expanded into the script
        # could close its quotes and run commands with the token.
        env:
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          curl -X POST -H "Accept: application/json" -H "Authorization: token $WEBHOOK_TOKEN" --data "$(jq -n --arg repository "$REPOSITORY" --arg branch "$BRANCH" '{event_type: $repository, client_payload: {branch: $branch, url: "https://github.com/\($repository)", version: "1.2.3"}}')" https://api.github.com/repos/BigLinux-Package-Build/build-package/dispatches
          curl -X POST -H "Accept: application/json" -H "Authorization: token $WEBHOOK_TOKEN" --data "$(jq -n --arg repository "$REPOSITORY" --arg branch "$BRANCH" '{event_type: $repository, client_payload: {branch: $branch, url: "https://github.com/\($repository)"}}')" https://api.github.com/repos/BigLinux-Package-Build/build-package-ARM/dispatches
